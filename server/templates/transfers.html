{% extends "admin_layout.html" %}
{% block content %}
<div style="padding:24px;max-width:1200px;margin:auto">
<h1 class="text-xl font-bold">双盘任务</h1>
<p style="margin:12px 0;color:#64748b">百度与夸克双向传输，完成校验后自动生成分享链接。失败任务保留下载缓存，可重试。</p>
<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px">
<a class="btn btn-primary" href="/admin/resources">选择资源并创建任务</a>
<button class="btn btn-secondary" id="personalExcelExportBtn">导出我的分享 Excel</button>
<select id="crossTaskFilter" class="admin-search-input"><option value="all">全部任务</option><option value="running">传输中</option><option value="queued">等待中</option><option value="failed">失败</option><option value="complete">已完成</option></select>
<span id="personalExcelExportStatus" role="status"></span><a id="personalExcelDownload" hidden download="personal-shares.xlsx">再次下载 Excel</a>
</div>
<div id="crossTransferStatus" role="status" aria-live="polite"></div>
<div id="crossTransferJobs" style="margin-top:16px"></div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static',filename='js/personal_export.js') }}?v=20261001-2"></script>
<script src="{{ url_for('static',filename='js/cross_transfer.js') }}?v=20261001-2"></script>
{% endblock %}
